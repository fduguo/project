run_id: qwen35_08b_ki_robocasa_debug
run_root_dir: /mnt/nas/gezuhao/zhouyuchen/playground/checkpoint
seed: 42
wandb_entity: "13328167328-"
wandb_project: starvla_qwen35_08b_ki_robocasa
is_debug: false
version_id: "0.21"

framework:
  name: QwenKI
  qwenvl:
    base_vlm: /mnt/nas/gezuhao/zhouyuchen/playground/Pretrained_models/Qwen3.5-0.8B-Action
    attn_implementation: flash_attention_2
  action_loss_weight: 1.0
  fast_loss_weight: 1.0
  detach_action_condition: true
  add_discretized_state_to_instruction: true
  fast_action_model:
    action_model_type: FAST
    fast_tokenizer_name: /mnt/nas/gezuhao/zhouyuchen/playground/Pretrained_models/fast
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 29           # 改为 GR1 动作维度
    state_dim: 58            # 改为 GR1 状态维度
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      action_dit_hidden_dim: 512
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3vl
    per_device_batch_size: 4
    data_root_dir: /dev/shm/starvla_vlm

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: ./playground/Datasets/nvidia/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000
    action_type: delta_qpos
    sequential_step_sampling: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av 
    # num_workers: 4
    # prefetch_factor: 8
    # pin_memory: true
    # persistent_workers: true
    # drop_last: true

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
    project_layers: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08