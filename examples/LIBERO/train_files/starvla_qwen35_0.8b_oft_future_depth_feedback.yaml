run_id: qwen35_0.8b_oft_future_depth_feedback_libero
run_root_dir: playground/Checkpoint
seed: 42
wandb_entity: "13328167328-"
wandb_project: starvla_qwen35_0.8b_oft_future_depth_feedback
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT_future_depth_feedback
  qwenvl:
    base_vlm: /mnt/nas/gezuhao/zhouyuchen/playground/Pretrained_models/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
  future_depth_head:
    enabled: true
    depth_model_name: /mnt/nas/gezuhao/zhouyuchen/playground/Pretrained_models/da3-small
    num_views: 2
    target_feature_layer: 11
    target_grid_size: 8
    target_feature_dim: 384
    target_image_size: 518
    predictor_num_layers: 2
    predictor_num_heads: 8
    predictor_ffn_mult: 2
    feedback_num_heads: 8
    feedback_gate_init: 0.0
    loss_weight: 0.01
    cosine_loss_weight: 0.0
  action_model:
    action_model_type: MLP
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /mnt/nas/gezuhao/zhouyuchen/dataset/LIBERO/libero
    data_mix: libero_all
    action_type: delta_qpos
    sequential_step_sampling: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av
    include_future_image: true
    future_step_k: 8
    lerobot_version: v2.0

trainer:
  max_train_steps: 90000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
    future_depth_head: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
